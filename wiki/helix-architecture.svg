<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><rect width="1200" height="1500" fill="#f2ece2"/><text x="70" y="80" font-family="Georgia" font-size="42" font-weight="bold" fill="#2c2420">Helix Architecture Overview</text><text x="70" y="125" font-family="Arial Narrow" font-size="20" letter-spacing="2" fill="#5c5349">CATHRYN LAVERY DIAGRAM STANDARD • GOVERNED WINDOWS ASSISTANT FOUNDATION</text><line x1="70" y1="155" x2="1130" y2="155" stroke="#c4501a" stroke-width="4"/><rect x="950" y="55" width="180" height="45" rx="4" fill="#2c2420"/><text x="1040" y="84" text-anchor="middle" font-family="monospace" font-size="16" fill="#f2ece2">SPECIFICATION v1</text><g font-family="Arial Narrow,Arial" fill="#2c2420"><rect x="180" y="220" width="840" height="150" fill="none" stroke="#5c5349" stroke-width="3"/><text x="215" y="270" font-size="28" font-weight="bold">1. OPERATOR &amp; INGRESS</text><text x="215" y="315" font-family="monospace" font-size="18" fill="#5c5349">Windows client • CLI • browser • local HTTP</text><path d="M600 370v65" stroke="#5c5349" stroke-width="3" marker-end="url(#a)"/><rect x="180" y="435" width="840" height="150" fill="none" stroke="#5c5349" stroke-width="3"/><text x="215" y="485" font-size="28" font-weight="bold">2. IIS / HTTP.SYS IDENTITY</text><text x="215" y="530" font-family="monospace" font-size="18" fill="#5c5349">Negotiate SSPI • SID • UPN • group SIDs</text><path d="M600 585v65" stroke="#5c5349" stroke-width="3" marker-end="url(#a)"/><rect x="180" y="650" width="840" height="180" fill="none" stroke="#c4501a" stroke-width="4"/><text x="215" y="700" font-size="28" font-weight="bold" fill="#c4501a">3. HELIX DAEMON</text><text x="215" y="745" font-family="monospace" font-size="18" fill="#5c5349">Session lifecycle • identity envelope • fail-closed policy</text><text x="215" y="780" font-family="monospace" font-size="18" fill="#5c5349">SQLite recovery • SSE replay • audit correlation</text><path d="M600 830v65" stroke="#5c5349" stroke-width="3" marker-end="url(#a)"/><rect x="180" y="895" width="840" height="180" fill="none" stroke="#5c5349" stroke-width="3"/><text x="215" y="945" font-size="28" font-weight="bold">4. SESSION SERVICE</text><text x="215" y="990" font-family="monospace" font-size="18" fill="#5c5349">ICF retrieval → WhichLLM routing → response</text><text x="215" y="1025" font-family="monospace" font-size="18" fill="#5c5349">persistence → audit • Sigil approval for actions</text><path d="M600 1075v65" stroke="#5c5349" stroke-width="3" marker-end="url(#a)"/><rect x="180" y="1140" width="840" height="150" fill="none" stroke="#5c5349" stroke-width="3"/><text x="215" y="1190" font-size="28" font-weight="bold">5. AUTHORITY BOUNDARIES</text><text x="215" y="1235" font-family="monospace" font-size="18" fill="#5c5349">ICF knowledge • WhichLLM models • Sigil execution</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5c5349"/></marker></defs></svg>